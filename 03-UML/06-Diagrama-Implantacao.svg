tail">«node»</text><text x="512" y="316" class="label">Servidor de aplicação</text><rect x="505" y="365" width="309" height="102" rx="12" fill="#fafdff" stroke="#b9cfe8"/><text x="524" y="407" class="label">Aplicação Web</text><text x="524" y="432" class="detail">Artefato previsto</text></g><g><rect class="panel" x="946" y="258" width="302" height="262" rx="20"/><rect x="962" y="274" width="270" height="51" rx="12" fill="#edf4ff"/><text x="978" y="296" class="detail">«node»</text><text x="978" y="316" class="label">Servidor de dados</text><rect x="971" y="365" width="252" height="102" rx="12" fill="#fafdff" stroke="#b9cfe8"/><text x="990" y="407" class="label">Banco de dados</text><text x="990" y="432" class="detail">Artefato previsto</text></g><rect x="377" y="369" width="95" height="28" rx="14" fill="#e6f2ff"/><text x="424" y="387" text-anchor="middle" class="detail">HTTPS</text><rect x="840" y="369" width="109" height="28" rx="14" fill="#e6f2ff"/><text x="894" y="387" text-anchor="middle" class="detail">Protegida</text><rect x="240" y="599" width="838" height="110" rx="18" fill="#fff" stroke="#c6d9ed"/><text x="269" y="639" class="section">Topologia de referência</text><text x="269" y="666" class="detail">A infraestrutura representada é um cenário de implantação proposto para o sistema completo.</text><text x="269" y="686" class="detail">O protótipo navegável da Sprint 2 é um arquivo HTML local, sem backend ou banco de dados.</text><text x="60" y="857" class="detail">Referência documental: 03-UML/03-Implantacao.md. Nós e comunicação são conceituais.</text></svg>