<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oportunidades Internacionais — Protótipo</title>
<style>
:root{
  color-scheme:light;
  --brand-950:#0B2344;--brand-800:#123D75;--primary-600:#1D62D0;--primary-700:#164FAE;
  --teal-600:#0F8079;--page:#F4F7FC;--surface:#FFFFFF;--surface-soft:#F7F9FD;
  --ink:#172B46;--ink-muted:#526781;--line:#DAE4F0;--success-ink:#12634D;
  --warning-ink:#895C17;--danger-ink:#A12D42;
  --radius-sm:10px;--radius-md:16px;--radius-lg:24px;
  --shadow:0 13px 34px rgba(25,54,94,.055),0 2px 8px rgba(25,54,94,.025);
  font:400 16px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color:var(--ink);background:var(--page);font-synthesis:none
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-width:320px;background:radial-gradient(ellipse at 8% -10%,#e8f1ff 0,transparent 42%),var(--page)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.55;box-shadow:none!important}
button,a,input,select,textarea,summary{outline-offset:3px}
:focus-visible{outline:3px solid #55a4f1!important;outline-offset:3px!important}
a{color:var(--primary-700)}
h1,h2,h3,p{overflow-wrap:break-word}
h1,h2,h3{color:var(--brand-950);letter-spacing:-.035em;line-height:1.22}
h1{font-size:clamp(1.8rem,3.4vw,2.45rem);font-weight:800;margin:0 0 12px}
h2{font-size:clamp(1.35rem,2.5vw,1.8rem);font-weight:780;margin:0 0 18px}
h3{font-size:1.1rem;font-weight:760;margin:3px 0 11px}
.shell{width:min(100%,1244px);margin:auto;padding:35px 22px 78px;min-height:60vh}
.top{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);box-shadow:0 2px 14px rgba(16,45,80,.03);backdrop-filter:blur(14px)}
.nav{width:min(100%,1244px);min-height:80px;padding:12px 22px;margin:auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;font-size:.94rem;font-weight:830;line-height:1.12;letter-spacing:-.035em;color:var(--brand-950)}
.logo span{color:var(--primary-600);display:block}
.logo-mark{display:grid;place-items:center;width:44px;height:44px;flex-shrink:0;border-radius:13px;background:linear-gradient(145deg,#174b91,var(--brand-950));color:white;font-size:1.03rem;font-weight:850;letter-spacing:-.07em;box-shadow:0 5px 14px #174b9130}
.logo-type{white-space:nowrap}
.links{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn,.tab{min-height:42px;border:1px solid #cedaec;border-radius:var(--radius-sm);background:var(--surface);padding:10px 16px;color:var(--brand-800);font-weight:690;line-height:1.3;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s;white-space:normal}
.btn:hover:not(:disabled),.tab:hover:not(:disabled){background:#eaf2ff;border-color:#a8c8f3;transform:translateY(-1px)}
.btn:active,.tab:active{transform:translateY(0)!important}
.btn.primary{background:var(--primary-600);border-color:var(--primary-600);color:white;box-shadow:0 5px 14px rgba(29,98,208,.16)}
.btn.primary:hover:not(:disabled){background:var(--primary-700);border-color:var(--primary-700);box-shadow:0 7px 18px rgba(29,98,208,.23)}
.btn.dark{background:var(--brand-950);border-color:var(--brand-950);color:#fff}
.btn.dark:hover:not(:disabled){background:var(--brand-800);color:#fff}
.btn.danger{background:#fff5f6;border-color:#f1ccd3;color:var(--danger-ink)}
.btn.danger:hover:not(:disabled){background:#ffebef}
.btn.mini,.tab.mini{min-height:36px;padding:8px 12px;font-size:.83rem}
.tab{border-color:transparent;background:transparent;color:var(--ink-muted)}
.tab.active,.active{background:#e9f2ff;color:var(--primary-700);border-color:#cee1fb}
header.hero{position:relative;isolation:isolate;overflow:hidden;min-height:340px;margin-bottom:35px;padding:clamp(32px,5vw,66px);border-radius:var(--radius-lg);background:linear-gradient(112deg,var(--brand-950) 1%,#13457f 57%,#187ca3 115%);box-shadow:0 20px 47px rgba(9,51,98,.14);display:flex;align-items:center}
header.hero:before{content:"";position:absolute;width:410px;height:410px;border:1px solid rgba(255,255,255,.15);border-radius:50%;top:-146px;right:-45px;box-shadow:0 0 0 65px rgba(255,255,255,.04),0 0 0 130px rgba(255,255,255,.025);z-index:-1}
header.hero:after{content:"";position:absolute;width:135px;height:135px;border-radius:50%;background:#50b7cc22;right:150px;bottom:-75px;z-index:-1}
.hero h1{font-size:clamp(2rem,4vw,3.35rem);max-width:730px;color:#fff;font-weight:820;letter-spacing:-.055em;line-height:1.09;margin:14px 0 16px}
.hero p{font-size:1.03rem;color:#e3edfa;max-width:620px;line-height:1.75;margin:0}
.hero .btn{margin-top:29px;background:white;border-color:white;color:var(--brand-950);box-shadow:0 8px 23px #071f4055}
.hero .btn:hover:not(:disabled){background:#eef6ff}
.hero .eyebrow{color:#b7e9fa!important}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:25px;box-shadow:var(--shadow)}
.card{display:flex;flex-direction:column;gap:13px;transition:transform .2s,box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 19px 40px rgba(25,54,94,.10);border-color:#bad2f3}
.card h3{font-size:1.18rem;line-height:1.35;margin:3px 0}
.card p{color:var(--ink-muted);line-height:1.67;margin:0;flex:1}
.card .btn{width:100%;margin-top:4px}
.muted{color:var(--ink-muted)}
.eyebrow{font-size:.72rem;font-weight:780;letter-spacing:.115em;text-transform:uppercase;color:var(--teal-600)}
.chip{display:inline-flex;gap:5px;align-items:center;align-self:flex-start;padding:6px 11px;border-radius:100px;background:#eaf2ff;border:1px solid #d7e7fb;color:#20589c;font-weight:760;font-size:.76rem}
.chip.dim{background:#f0f3f7;border-color:#e3e8f0;color:#536478}
.chip.good{background:#e5f6ed;border-color:#c8e8d7;color:var(--success-ink)}
.sectionhead{margin:10px 0 26px;display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sectionhead p{color:var(--ink-muted);margin:7px 0 0;line-height:1.6}
.toolbar{display:grid;grid-template-columns:1.7fr repeat(3,minmax(0,1fr));gap:13px;margin-bottom:20px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);box-shadow:var(--shadow)}
label{display:flex;flex-direction:column;gap:8px;font-size:.87rem;font-weight:730;color:var(--ink)}
input,select,textarea{width:100%;min-height:46px;border:1px solid #cbd7e6;border-radius:var(--radius-sm);padding:11px 14px;background:white;color:var(--ink);transition:border-color .16s,box-shadow .16s}
input:hover,select:hover,textarea:hover{border-color:#9db9d8}
input:focus,select:focus,textarea:focus{border-color:#3a86e3;box-shadow:0 0 0 3px #cfe4ff80}
input::placeholder,textarea::placeholder{color:#718198}
textarea{min-height:108px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stack{display:flex;flex-direction:column;gap:16px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.back{display:inline-flex;align-items:center;gap:8px;margin:0 0 20px;color:var(--primary-700);font-weight:750;text-decoration:none}
.back:hover{text-decoration:underline}
.empty{padding:50px 24px;text-align:center;background:white;border:1.5px dashed #b6cbe2;border-radius:var(--radius-md);color:var(--ink-muted)}
.empty h2,.empty h3{color:var(--brand-950)}
.notice{padding:16px 18px;border:1px solid #c6dafa;background:#eff6ff;color:#234b80;border-radius:var(--radius-sm);line-height:1.7;font-size:.94rem}
.notice.warn{background:#fff8e9;border-color:#f0d6a0;color:var(--warning-ink)}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:25px 0}
.meta>div{background:var(--surface-soft);padding:17px;border-radius:var(--radius-sm);border:1px solid #ecf0f7}
.meta strong{display:block;color:var(--brand-950);margin-bottom:7px;font-size:.85rem}
.rows{display:grid;gap:12px}
.item{padding:19px 21px;border:1px solid var(--line);border-radius:var(--radius-md);background:white;display:flex;justify-content:space-between;align-items:center;gap:17px;flex-wrap:wrap;box-shadow:0 3px 13px rgba(25,54,94,.035)}
.item h3{margin:0 0 6px}
.item p{margin:0;color:var(--ink-muted)}
.item .actions{margin-top:0}
.item .chip{margin-top:9px}
.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:19px}
.fieldgrid .wide{grid-column:1/-1}
.helper{font-size:.83rem;color:var(--ink-muted);line-height:1.6}
.stat{font-size:2.6rem;font-weight:830;letter-spacing:-.06em;line-height:1.18;color:var(--primary-700);margin-top:11px}
details{font-size:.88rem;color:var(--ink-muted);margin-top:12px}
summary{cursor:pointer;color:var(--primary-700);font-weight:700}
dialog{border:1px solid var(--line);border-radius:var(--radius-lg);max-width:500px;width:calc(100% - 30px);padding:30px;box-shadow:0 25px 75px #0c244c55}
dialog::backdrop{background:#071d3ca8;backdrop-filter:blur(3px)}
dialog h2{margin-bottom:14px}
.toast{position:fixed;bottom:24px;right:24px;max-width:min(400px,calc(100vw - 32px));background:var(--brand-950);border:1px solid #466181;color:white;padding:15px 20px;border-radius:var(--radius-sm);box-shadow:0 15px 35px #1234;z-index:20;font-weight:650}
footer{font-size:.82rem;text-align:center;color:var(--ink-muted);padding:27px 15px 36px;border-top:1px solid var(--line)}
@media(max-width:1050px){.toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:860px){.nav{min-height:72px}.two{grid-template-columns:1fr}.hero{min-height:290px}.meta{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.grid,.toolbar,.meta,.fieldgrid{grid-template-columns:1fr}.fieldgrid .wide{grid-column:auto}.shell{padding:22px 14px 55px}.nav{padding:12px 14px;gap:12px}.links{width:100%;margin-left:0;justify-content:flex-start;gap:5px}.logo-mark{width:40px;height:40px}.tab.mini,.btn.mini{font-size:.76rem;padding:8px 10px}.hero{padding:35px 25px;min-height:325px}.hero:before{right:-190px}.card,.panel{padding:20px}.toolbar{padding:15px}.item{align-items:flex-start;padding:18px}.item .actions{width:100%}.item .actions button{flex:1}.sectionhead{align-items:flex-start}}
@media(max-width:390px){.nav{padding:10px 12px}.links{gap:3px}.tab.mini,.btn.mini{padding:7px 8px;font-size:.72rem}.hero{padding:28px 21px}.shell{padding:17px 12px 45px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{transition:none!important;animation:none!important}}
</style></head>
<body>
<div class="top"><nav class="nav" aria-label="Navegação principal">
 <div class="logo" aria-label="Oportunidades Internacionais"><span class="logo-mark" aria-hidden="true">OI</span><span class="logo-type">Oportunidades <span>Internacionais</span></span></div>
 <div class="links" id="navlinks"></div>
</nav></div>
<main class="shell" id="app" tabindex="-1"></main>
<footer>Protótipo acadêmico demonstrativo • Grupo 7 • Proposta 3 • Dados fictícios</footer>
<dialog id="confirmDialog" aria-labelledby="confirmTitle"><h2 id="confirmTitle">Confirmar interesse</h2><p>Você deseja registrar uma manifestação de interesse nesta oportunidade?</p><div class="notice">Esta manifestação de interesse não constitui inscrição formal, seleção nem concessão de bolsa.</div><div class="actions"><button class="btn" id="cancelConfirm">Cancelar</button><button class="btn primary" id="acceptConfirm">Confirmar manifestação</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* Protótipo sem backend. Dados demonstrativos são armazenados apenas nesta sessão do navegador. */
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const future=d=>{const x=new Date(TODAY);x.setDate(x.getDate()+d);return x.toISOString().slice(0,10)};
const initial=[
{id:1,title:"Bolsa de mobilidade acadêmica",type:"Bolsa",country:"Portugal",area:"Tecnologia",deadline:future(70),description:"Oportunidade acadêmica de mobilidade internacional com atividades e experiências em instituição parceira.",requirements:"Estar regularmente matriculado; observar os critérios do edital.",documents:"Histórico acadêmico e documentos indicados no edital.",state:"Publicada"},
{id:2,title:"Edital de intercâmbio estudantil",type:"Edital",country:"Espanha",area:"Administração",deadline:future(42),description:"Programa demonstrativo de intercâmbio para estudantes interessados em vivência acadêmica internacional.",requirements:"Verificar os critérios acadêmicos da oportunidade.",documents:"Documento de identificação e documentação indicada.",state:"Publicada"},
{id:3,title:"Mobilidade em universidade parceira",type:"Edital",country:"Canadá",area:"Engenharia",deadline:future(110),description:"Programa ilustrativo de mobilidade internacional em instituição de ensino superior.",requirements:"Atender às condições definidas na oportunidade.",documents:"Documentos de matrícula e demais comprovantes solicitados.",state:"Publicada"},
{id:4,title:"Bolsa de estudos — edição anterior",type:"Bolsa",country:"Chile",area:"Tecnologia",deadline:future(-30),description:"Exemplo de oportunidade encerrada para demonstração do controle de prazo.",requirements:"Requisitos do edital encerrado.",documents:"Documentos conforme o edital.",state:"Encerrada"}
];
const clone=x=>JSON.parse(JSON.stringify(x));
const state={page:"home",role:"visitante",selected:1,returnTo:null,editing:null,query:"",filterType:"",filterCountry:"",filterArea:"",opps:clone(initial),interests:[],nextOpp:5,nextInterest:1,student:"estudante-demo",toastTimer:null};
const $=s=>document.querySelector(s);
const esc=x=>String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const fmt=x=>new Date(x+"T12:00:00").toLocaleDateString("pt-BR");
const status=(s)=>'<span class="chip '+(s==="Publicada"?"good":(s==="Encerrada"||s==="Arquivada")?"dim":"")+'">'+esc(s)+'</span>';
const active=o=>o.state==="Publicada"&&o.deadline>=future(0);
const eligible=o=>o.state==="Publicada"&&o.deadline>=future(0);
const selected=()=>state.opps.find(x=>x.id===state.selected);
const own=()=>state.interests.filter(x=>x.student===state.student);
function toast(msg){const el=$("#toast");el.innerHTML='<div class="toast">'+esc(msg)+'</div>';clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.textContent="",3800)}
function show(page){state.page=page;render();window.scrollTo(0,0)}
function navigate(page){show(page)}
function setRole(role){state.role=role;const back=state.returnTo;state.returnTo=null;if(role==="gestor")show("dashboard");else if(role==="estudante")show(back==="detail"?"detail":"my");else show("home");toast("Perfil demonstrativo: "+role)}
function requireRole(role,back){if(state.role!==role){state.returnTo=back||null;show("profile");toast("Selecione o perfil "+role+" para continuar");return false}return true}
function menu(){
 const links=[["home","Início"],["catalog","Oportunidades"]];
 if(state.role==="estudante")links.push(["my","Meus interesses"]);
 if(state.role==="gestor")links.push(["dashboard","Painel gestor"],["manage","Manifestações"]);
 const b=links.map(([id,t])=>'<button class="tab mini '+(state.page===id?"active":"")+'" data-go="'+id+'">'+t+'</button>').join("");
 $("#navlinks").innerHTML=b+'<button class="btn mini" data-go="profile">Perfil: '+esc(state.role)+"</button>";
}
function card(o){return '<article class="card"><div class="eyebrow">'+esc(o.type)+' • '+esc(o.country)+'</div><h3>'+esc(o.title)+'</h3><p>'+esc(o.description)+'</p><div>'+status(o.state)+'</div><div class="helper">Área: '+esc(o.area||"Não informada")+' • Prazo: '+fmt(o.deadline)+'</div><button class="btn primary" data-open="'+o.id+'">Ver detalhes</button></article>'}
function home(){return '<header class="hero"><div class="hero-content"><div class="eyebrow" style="color:#c8e3ff">Mobilidade e oportunidades acadêmicas</div><h1>Explore oportunidades para estudar no exterior.</h1><p>Encontre editais, bolsas, requisitos e prazos em uma plataforma organizada. Demonstração dos fluxos de consulta e acompanhamento de interesse.</p><button class="btn" data-go="catalog">Explorar oportunidades</button></div></header><div class="sectionhead"><div><h2>Oportunidades em destaque</h2><p>Exemplos disponíveis para navegação.</p></div><button class="btn" data-go="catalog">Ver todas</button></div><div class="grid">'+state.opps.filter(eligible).slice(0,3).map(card).join("")+'</div>'}
function catalog(){const publicOpps=state.opps.filter(o=>o.state==="Publicada");const countries=[...new Set(publicOpps.map(o=>o.country).filter(Boolean))];const areas=[...new Set(publicOpps.map(o=>o.area).filter(Boolean))];const found=publicOpps.filter(o=>(o.title+" "+o.description+" "+o.area+" "+o.country).toLowerCase().includes(state.query.toLowerCase())&&(!state.filterType||o.type===state.filterType)&&(!state.filterCountry||o.country===state.filterCountry)&&(!state.filterArea||o.area===state.filterArea));return '<div class="sectionhead"><div><h1>Catálogo de oportunidades</h1><p>Consulte editais, bolsas, destinos e requisitos.</p></div></div><div class="toolbar"><label>Pesquisar<input id="search" placeholder="Nome, país ou área" value="'+esc(state.query)+'"></label><label>Tipo<select id="typeFilter"><option value="">Todos</option>'+["Bolsa","Edital"].map(t=>'<option '+(state.filterType===t?"selected":"")+'>'+t+'</option>').join("")+'</select></label><label>Destino<select id="countryFilter"><option value="">Todos</option>'+countries.map(t=>'<option '+(state.filterCountry===t?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select></label><label>Área<select id="areaFilter"><option value="">Todas</option>'+areas.map(t=>'<option '+(state.filterArea===t?"selected":"")+'>'+esc(t)+'</option>').join("")+'</select></label></div><p class="muted">'+found.length+' oportunidade(s) encontrada(s)</p>'+(found.length?'<div class="grid">'+found.map(card).join("")+'</div>':'<div class="empty">Nenhuma oportunidade encontrada.<div class="actions" style="justify-content:center"><button class="btn" id="clearFilters">Limpar filtros</button></div></div>')}
function detail(){const o=selected();if(!o)return '<div class="empty">Oportunidade não encontrada. <button class="btn" data-go="catalog">Voltar</button></div>';const existing=own().find(x=>x.oppId===o.id&&x.status!=="Encerrado");let action="";
if(existing)action='<button class="btn primary" data-go="my">Ver meu interesse registrado</button>';
else if(!active(o))action='<button class="btn" disabled>Manifestações indisponíveis</button>';
else action='<button class="btn primary" id="interestBtn">Manifestar interesse</button>';
return '<a class="back" href="#catalog" data-go="catalog">← Voltar ao catálogo</a><div class="panel"><div class="eyebrow">'+esc(o.type)+' • '+esc(o.country)+'</div><div class="sectionhead"><div><h1>'+esc(o.title)+'</h1><p>'+esc(o.description)+'</p></div>'+status(o.state)+'</div><div class="meta"><div><strong>Prazo</strong>'+fmt(o.deadline)+'</div><div><strong>Destino</strong>'+esc(o.country||"Não informado")+'</div><div><strong>Área</strong>'+esc(o.area||"Não informada")+'</div></div><div class="two"><section><h3>Requisitos</h3><p class="muted">'+esc(o.requirements)+'</p></section><section><h3>Documentos necessários</h3><p class="muted">'+esc(o.documents)+'</p></section></div><div class="notice" style="margin-top:24px">Manifestar interesse não equivale a fazer uma inscrição formal no programa.</div><div class="actions">'+action+'</div></div>'}
function profile(){return '<div class="sectionhead"><div><h1>Entrada por perfil</h1><p>Escolha um perfil para percorrer os fluxos do protótipo.</p></div></div><div class="notice">Esta entrada é uma simulação para demonstração acadêmica, sem login real.</div><div class="two" style="margin-top:20px"><div class="card"><h2>Estudante</h2><p>Registre interesse em oportunidades e acompanhe seus registros.</p><button class="btn primary" data-role="estudante">Entrar como estudante</button></div><div class="card"><h2>Gestor de oportunidades</h2><p>Cadastre, publique e encerre oportunidades. Atualize situações de interesse.</p><button class="btn primary" data-role="gestor">Entrar como gestor</button></div></div><div class="actions"><button class="btn" data-role="visitante">Continuar como visitante</button></div>'}
function my(){if(state.role!=="estudante")return denied();const records=own();return '<div class="sectionhead"><div><h1>Meus interesses</h1><p>Registros associados ao estudante demonstrativo.</p></div><button class="btn" data-go="catalog">Explorar oportunidades</button></div>'+(records.length?'<div class="rows">'+records.map(i=>{const o=state.opps.find(x=>x.id===i.oppId);return '<div class="item"><div><h3>'+esc(o?.title||"Oportunidade")+'</h3><p>Registro: '+fmt(i.date)+'</p><p>'+status(i.status)+'</p><details><summary>Histórico</summary><ul>'+i.history.map(h=>'<li>'+esc(h.date)+' — '+esc(h.status)+' ('+esc(h.by)+')</li>').join("")+'</ul></details></div><button class="btn" data-open="'+i.oppId+'">Ver oportunidade</button></div>'}).join("")+'</div>':'<div class="empty"><h3>Nenhuma manifestação registrada</h3><p>Explore o catálogo e manifeste interesse em uma oportunidade aberta.</p></div>')}
function denied(){return '<div class="empty"><h2>Acesso restrito por perfil</h2><p>Selecione o perfil correspondente para entrar nesta área.</p><button class="btn primary" data-go="profile">Selecionar perfil</button></div>'}
function dashboard(){
 if(state.role!=="gestor")return denied();
 const current=state.opps.filter(o=>o.state!=="Arquivada");
 const archived=state.opps.filter(o=>o.state==="Arquivada");
 const row=o=>'<div class="item"><div><h3>'+esc(o.title)+'</h3><p>'+esc(o.country)+' • '+fmt(o.deadline)+' • '+esc(o.type)+'</p>'+status(o.state)+'</div><div class="actions"><button class="btn" data-edit="'+o.id+'">Editar</button>'+(o.state==="Publicada"?'<button class="btn danger" data-close="'+o.id+'">Encerrar</button>':"")+(o.state==="Encerrada"?'<button class="btn dark" data-archive="'+o.id+'">Arquivar</button>':"")+'</div></div>';
 const archiveRow=o=>'<div class="item"><div><h3>'+esc(o.title)+'</h3><p>'+esc(o.country)+' • '+fmt(o.deadline)+' • '+esc(o.type)+'</p>'+status(o.state)+'</div><div class="actions"><button class="btn" data-unarchive="'+o.id+'">Desarquivar</button></div></div>';
 return '<div class="sectionhead"><div><h1>Painel do gestor</h1><p>Gerencie publicações, encerramentos e arquivamento de oportunidades.</p></div><button class="btn primary" id="newOpp">+ Nova oportunidade</button></div>'
 +'<div class="two"><div class="panel"><div class="eyebrow">Publicadas</div><div class="stat">'+state.opps.filter(o=>o.state==="Publicada").length+'</div></div><div class="panel"><div class="eyebrow">Manifestações registradas</div><div class="stat">'+state.interests.length+'</div></div></div>'
 +'<h2 style="margin-top:28px">Oportunidades em gestão</h2><div class="rows">'+(current.length?current.map(row).join(""):'<div class="empty">Nenhuma oportunidade em gestão.</div>')+'</div>'
 +'<h2 style="margin-top:32px">Arquivo de oportunidades ('+archived.length+')</h2><p class="muted">Oportunidades arquivadas ficam fora do catálogo. Use Desarquivar para retorná-las à gestão no estado Encerrada.</p><div class="rows">'+(archived.length?archived.map(archiveRow).join(""):'<div class="empty">Nenhuma oportunidade arquivada.</div>')+'</div>'
 +'<div class="actions"><button class="btn primary" data-go="manage">Gerenciar manifestações</button></div>';
}
function form(){if(state.role!=="gestor")return denied();const o=state.opps.find(x=>x.id===state.editing)||{};if(o.state==="Arquivada")return '<div class="empty"><h2>Oportunidade arquivada</h2><p>Este registro está disponível somente para consulta no painel do gestor.</p><button class="btn" data-go="dashboard">Voltar ao painel</button></div>';const val=k=>esc(o[k]||"");return '<a class="back" href="#dashboard" data-go="dashboard">← Voltar ao painel</a><div class="panel"><h1>'+(o.id?"Editar oportunidade":"Nova oportunidade")+'</h1><p class="muted">Preencha os dados. A publicação exige os campos essenciais.</p><form id="oppForm" class="fieldgrid"><label>Título *<input name="title" maxlength="120" value="'+val("title")+'"></label><label>Tipo *<select name="type"><option value="">Selecione</option>'+["Bolsa","Edital"].map(t=>'<option '+(o.type===t?"selected":"")+'>'+t+'</option>').join("")+'</select></label><label>Destino<input name="country" placeholder="Quando aplicável" value="'+val("country")+'"></label><label>Área<input name="area" placeholder="Área de estudo" value="'+val("area")+'"></label><label>Prazo *<input type="date" name="deadline" value="'+val("deadline")+'"></label><label class="wide">Descrição *<textarea name="description">'+val("description")+'</textarea></label><label>Requisitos *<textarea name="requirements">'+val("requirements")+'</textarea></label><label>Documentos *<textarea name="documents">'+val("documents")+'</textarea><span class="helper">Se não houver, informe “Não se aplica”.</span></label><div class="wide notice" id="formMessage" hidden></div><div class="wide actions"><button type="button" class="btn" id="saveDraft">'+(o.state==="Publicada"||o.state==="Encerrada"?"Salvar alterações":"Salvar rascunho")+'</button>'+((o.state==="Encerrada"||o.state==="Arquivada")?"":'<button type="submit" class="btn primary">'+(o.state==="Publicada"?"Salvar e manter publicada":"Publicar oportunidade")+"</button>")+'</div></form></div>'}
function manage(){if(state.role!=="gestor")return denied();return '<div class="sectionhead"><div><h1>Gestão de manifestações</h1><p>Atualize a situação de interesse e acompanhe o histórico.</p></div><button class="btn" data-go="dashboard">Painel do gestor</button></div>'+(state.interests.length?'<div class="rows">'+state.interests.map(i=>{const o=state.opps.find(x=>x.id===i.oppId),options=(i.status==="Registrado"?["Registrado","Em acompanhamento","Encerrado"]:i.status==="Em acompanhamento"?["Em acompanhamento","Encerrado"]:["Encerrado"]);return '<div class="item"><div><h3>'+esc(o?.title||"Oportunidade")+'</h3><p>Estudante: '+esc(i.student)+' • Registrado em '+fmt(i.date)+'</p>'+status(i.status)+'<details><summary>Histórico</summary><ul>'+i.history.map(h=>'<li>'+esc(h.date)+' — '+esc(h.status)+' ('+esc(h.by)+')</li>').join("")+'</ul></details></div><div><label>Atualizar situação<select id="s'+i.id+'">'+options.map(t=>'<option '+(t===i.status?"selected":"")+'>'+t+'</option>').join("")+'</select></label><button class="btn primary mini" style="margin-top:9px" data-update="'+i.id+'">Salvar alteração</button></div></div>'}).join("")+'</div>':'<div class="empty">Ainda não há manifestações registradas. Entre como estudante para criar uma demonstração.</div>')}
const views={home,catalog,detail,profile,my,dashboard,form,manage};
function render(){menu();$("#app").innerHTML=(views[state.page]||home)();$("#app").focus({preventScroll:true})}
function getForm(){const d=Object.fromEntries(new FormData($("#oppForm")).entries());return Object.fromEntries(Object.entries(d).map(([k,v])=>[k,String(v).trim()]))}
function saveOpp(publish){
 const d=getForm(),o=state.opps.find(x=>x.id===state.editing);
 const previousState=o?.state||"Rascunho";
 if(previousState==="Arquivada"){toast("Oportunidades arquivadas ficam disponíveis somente para consulta");return}
 if(previousState==="Encerrada"&&publish){toast("Oportunidades encerradas não podem ser republicadas nesta demonstração");return}
 const willBePublic=previousState==="Publicada"||publish;
 const missing=["title","type","deadline","description","requirements","documents"].filter(k=>!d[k]);
 if(willBePublic&&missing.length){
  const box=$("#formMessage");box.hidden=false;box.className="wide notice warn";
  box.textContent="Preencha os campos obrigatórios antes de salvar uma publicação: "+missing.join(", ");return;
 }
 let target=o;
 if(!target){target={id:state.nextOpp++};state.opps.unshift(target)}
 Object.assign(target,d);
 target.state=previousState==="Encerrada"?"Encerrada":willBePublic?"Publicada":"Rascunho";
 show("dashboard");
 toast(target.state==="Publicada"?"Oportunidade salva e publicada":target.state==="Encerrada"?"Alterações salvas; oportunidade permanece encerrada":"Rascunho salvo");
}
document.addEventListener("click",e=>{
const go=e.target.closest("[data-go]");if(go){e.preventDefault();navigate(go.dataset.go);return}
const role=e.target.closest("[data-role]");if(role){setRole(role.dataset.role);return}
const open=e.target.closest("[data-open]");if(open){state.selected=Number(open.dataset.open);show("detail");return}
const edit=e.target.closest("[data-edit]");if(edit&&state.role==="gestor"){state.editing=Number(edit.dataset.edit);show("form");return}
const close=e.target.closest("[data-close]");if(close&&state.role==="gestor"){const o=state.opps.find(x=>x.id===Number(close.dataset.close));if(o&&o.state==="Publicada"&&confirm("Encerrar esta oportunidade? Ela deixará de aceitar novos interesses.")){o.state="Encerrada";render();toast("Oportunidade encerrada. Você pode arquivá-la no painel.")}return}
const archive=e.target.closest("[data-archive]");if(archive&&state.role==="gestor"){const o=state.opps.find(x=>x.id===Number(archive.dataset.archive));if(o&&o.state==="Encerrada"&&confirm("Arquivar esta oportunidade encerrada? O histórico será preservado.")){o.state="Arquivada";render();toast("Oportunidade arquivada e movida para o arquivo do gestor.")}return}
const unarchive=e.target.closest("[data-unarchive]");if(unarchive&&state.role==="gestor"){const o=state.opps.find(x=>x.id===Number(unarchive.dataset.unarchive));if(o&&o.state==="Arquivada"&&confirm("Desarquivar esta oportunidade? Ela voltará para Encerrada e continuará sem aceitar novos interesses.")){o.state="Encerrada";render();toast("Oportunidade desarquivada. Estado atual: Encerrada.")}return}
const upd=e.target.closest("[data-update]");if(upd&&state.role==="gestor"){const i=state.interests.find(x=>x.id===Number(upd.dataset.update)),next=$("#s"+i.id).value;if(next!==i.status){i.status=next;i.history.push({status:next,by:"Gestor demonstrativo",date:new Date().toLocaleString("pt-BR")});render();toast("Situação atualizada")}else toast("Nenhuma alteração realizada");return}
if(e.target.id==="newOpp"){state.editing=null;show("form")}
if(e.target.id==="saveDraft")saveOpp(false);
if(e.target.id==="interestBtn"){if(!requireRole("estudante","detail"))return;const o=selected();if(!o||!active(o)){toast("Oportunidade indisponível para manifestação");return}const exists=own().find(x=>x.oppId===o.id&&x.status!=="Encerrado");if(exists){show("my");toast("Já existe manifestação ativa para esta oportunidade");return}$("#confirmDialog").showModal()}
if(e.target.id==="clearFilters"){state.query="";state.filterType="";state.filterCountry="";state.filterArea="";render()}
if(e.target.id==="cancelConfirm")$("#confirmDialog").close();
if(e.target.id==="acceptConfirm"){if(state.role!=="estudante"){ $("#confirmDialog").close();return}const o=selected();if(o&&active(o)&&!own().some(x=>x.oppId===o.id&&x.status!=="Encerrado")){state.interests.push({id:state.nextInterest++,oppId:o.id,student:state.student,status:"Registrado",date:future(0),history:[{status:"Registrado",date:new Date().toLocaleString("pt-BR"),by:"Estudante demonstrativo"}]});$("#confirmDialog").close();show("my");toast("Interesse registrado com sucesso")}else{$("#confirmDialog").close();toast("Não foi possível registrar a manifestação")}}
});
document.addEventListener("input",e=>{if(e.target.id==="search"){state.query=e.target.value;const pos=e.target.selectionStart;const old=e.target.value;render();const inp=$("#search");inp.focus();inp.setSelectionRange(pos,pos)}});
document.addEventListener("change",e=>{if(e.target.id==="typeFilter"){state.filterType=e.target.value;render()}if(e.target.id==="countryFilter"){state.filterCountry=e.target.value;render()}if(e.target.id==="areaFilter"){state.filterArea=e.target.value;render()}});
document.addEventListener("submit",e=>{if(e.target.id==="oppForm"){e.preventDefault();saveOpp(true)}});
window.addEventListener("hashchange",()=>{const target=location.hash.slice(1);if(target==="catalog")show("catalog");if(target==="dashboard")show("dashboard")});
render();
</script></body></html>
